name: Update Jokerit data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch and prepare Jokerit data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          url = "https://liiga.fi/api/v2/games?tournament=runkosarja&season=2027"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req) as response:
              games = json.load(response)

          with open("liiga-games.json", "w", encoding="utf-8") as f:
              json.dump(games, f, ensure_ascii=False, indent=2)

          jokerit_games = []

          for game in games:
              home = game.get("homeTeam", {})
              away = game.get("awayTeam", {})

              if (
                  home.get("teamName") == "Jokerit"
                  or away.get("teamName") == "Jokerit"
              ):
                  jokerit_games.append(game)

          ended_games = [
              g for g in jokerit_games
              if g.get("ended") is True
          ]

          upcoming_games = [
              g for g in jokerit_games
              if g.get("ended") is not True
          ]

          ended_games.sort(
              key=lambda g: g.get("start", "")
          )

          upcoming_games.sort(
              key=lambda g: g.get("start", "")
          )

          wins = 0
          losses = 0
          ot_losses = 0
          points = 0

          for game in ended_games:
              home = game.get("homeTeam", {})
              away = game.get("awayTeam", {})

              home_goals = home.get("goals", 0)
              away_goals = away.get("goals", 0)

              if home.get("teamName") == "Jokerit":
                  jokerit_goals = home_goals
                  opponent_goals = away_goals
              else:
                  jokerit_goals = away_goals
                  opponent_goals = home_goals

              finished_type = game.get(
                  "finishedType", ""
              ).upper()

              is_ot_or_so = (
                  "OVERTIME" in finished_type
                  or "WINNING_SHOT" in finished_type
              )

              if jokerit_goals > opponent_goals:
                  wins += 1
                  points += 2 if is_ot_or_so else 3
              else:
                  if is_ot_or_so:
                      ot_losses += 1
                      points += 1
                  else:
                      losses += 1

          all_finished = [
              g for g in games
              if g.get("ended") is True
          ]

          teams = {}

          for game in all_finished:
              home = game.get("homeTeam", {})
              away = game.get("awayTeam", {})

              home_name = home.get("teamName", "")
              away_name = away.get("teamName", "")

              if not home_name or not away_name:
                  continue

              home_goals = home.get("goals", 0)
              away_goals = away.get("goals", 0)

              for team_name in [home_name, away_name]:
                  if team_name not in teams:
                      teams[team_name] = {
                          "games": 0,
                          "wins": 0,
                          "losses": 0,
                          "ot": 0,
                          "points": 0
                      }

              teams[home_name]["games"] += 1
              teams[away_name]["games"] += 1

              finished_type = game.get(
                  "finishedType", ""
              ).upper()

              is_ot_or_so = (
                  "OVERTIME" in finished_type
                  or "WINNING_SHOT" in finished_type
              )

              if home_goals > away_goals:
                  teams[home_name]["wins"] += 1

                  if is_ot_or_so:
                      teams[home_name]["points"] += 2
                      teams[away_name]["ot"] += 1
                      teams[away_name]["points"] += 1
                  else:
                      teams[home_name]["points"] += 3
                      teams[away_name]["losses"] += 1

              elif away_goals > home_goals:
                  teams[away_name]["wins"] += 1

                  if is_ot_or_so:
                      teams[away_name]["points"] += 2
                      teams[home_name]["ot"] += 1
                      teams[home_name]["points"] += 1
                  else:
                      teams[away_name]["points"] += 3
                      teams[home_name]["losses"] += 1

          standings = sorted(
              teams.items(),
              key=lambda item: (
                  -item[1]["points"],
                  -item[1]["wins"],
                  item[0]
              )
          )

          position = next(
              (
                  i + 1
                  for i, (name, stats)
                  in enumerate(standings)
                  if name == "Jokerit"
              ),
              "-"
          )

          finland = ZoneInfo("Europe/Helsinki")

          def format_date(game):
              value = game.get("start", "")

              if not value:
                  return ""

              dt = datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )

              return dt.astimezone(finland).strftime(
                  "%d.%m.%Y"
              )

          def format_time(game):
              value = game.get("start", "")

              if not value:
                  return ""

              dt = datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )

              return dt.astimezone(finland).strftime(
                  "%H:%M"
              )

          next_game = {
              "date": "",
              "time": "",
              "home": "",
              "away": ""
          }

          if upcoming_games:
              game = upcoming_games[0]

              next_game = {
                  "date": format_date(game),
                  "time": format_time(game),
                  "home": game.get(
                      "homeTeam", {}
                  ).get("teamName", ""),
                  "away": game.get(
                      "awayTeam", {}
                  ).get("teamName", "")
              }

          last_game = {
              "date": "",
              "home": "",
              "away": "",
              "result": ""
          }

          if ended_games:
              game = ended_games[-1]

              home = game.get("homeTeam", {})
              away = game.get("awayTeam", {})

              last_game = {
                  "date": format_date(game),
                  "home": home.get("teamName", ""),
                  "away": away.get("teamName", ""),
                  "result": (
                      f'{home.get("goals", 0)}–'
                      f'{away.get("goals", 0)}'
                  )
              }

          data = {
              "updatedAt": datetime.now(
                  ZoneInfo("Europe/Helsinki")
              ).strftime(
                  "%d.%m.%Y %H:%M"
              ),

              "team": {
                  "name": "Jokerit",
                  "position": position,
                  "games": len(ended_games),
                  "wins": wins,
                  "losses": losses,
                  "ot": ot_losses,
                  "points": points
              },

              "nextGame": next_game,
              "lastGame": last_game
          }

          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Jokerit data created successfully.")
          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
          )

          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liiga-games.json data.json
          git diff --cached --quiet || git commit -m "Update Jokerit data"
          git push
